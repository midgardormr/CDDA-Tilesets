name: Bright Nights UltiCa builds

on:
  push:
    branches: [ultica-bn]
    paths:
      - 'gfx/UltimateCataclysm/**'
      - 'gfx/Chibi_Ultica/**'
      - 'gfx/MShockXotto+/**'
      - 'tools/compose.py'
      - 'tools/tests/**'
      - '.github/workflows/ultica_bn_ci_build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tileset: [UltimateCataclysm, Chibi_Ultica]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libvips42
      - run: python -m pip install pyvips tqdm
      - run: python -m unittest discover -s tools/tests
      - name: Compose from this branch's sources
        env:
          TILESET: ${{ matrix.tileset }}
        run: |
          python tools/compose.py --use-all --feedback CONCISE "gfx/$TILESET" "build/$TILESET"
          cp "gfx/$TILESET/tileset.txt" "build/$TILESET/"
          cp "gfx/$TILESET/fallback.png" "build/$TILESET/"
          cp "gfx/$TILESET/layering.json" "build/$TILESET/"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tileset }}-BN
          path: build/${{ matrix.tileset }}/

  release:
    needs: build
    if: github.ref == 'refs/heads/ultica-bn'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UltimateCataclysm-BN
          path: release/UltimateCataclysm
      - uses: actions/download-artifact@v4
        with:
          name: Chibi_Ultica-BN
          path: release/ChibiUltica
      - name: Publish versioned BN tilesets
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          set -euo pipefail
          tag="ultica-bn-${GITHUB_SHA:0:12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its files unchanged."
            exit 0
          fi
          for tileset in UltimateCataclysm ChibiUltica; do
            printf 'Source: https://github.com/%s\nCommit: %s\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_SHA" >"$tileset/SOURCE.txt"
            zip -qr "$tileset.zip" "$tileset"
          done
          sha256sum UltimateCataclysm.zip ChibiUltica.zip >SHA256SUMS
          gh release create "$tag" UltimateCataclysm.zip ChibiUltica.zip SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "UltiCa for Bright Nights (${GITHUB_SHA:0:12})" \
            --notes "Built from $GITHUB_SHA. Original artwork credits and licenses are retained in the source repository and tileset metadata." \
            --prerelease --latest=false
